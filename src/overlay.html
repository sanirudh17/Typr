<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; }
      html, body {
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .pill {
        display: none;
        align-items: center;
        justify-content: center;
        height: 32px;
        padding: 0 14px;
        border-radius: 16px;
        background: rgba(18, 18, 22, 0.92);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(94, 106, 210, 0.25);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        transition: opacity 0.2s ease, transform 0.2s ease;
      }
      .pill.recording {
        display: flex;
        animation: fadeIn 0.15s ease;
      }
      .pill.processing {
        display: flex;
        animation: fadeIn 0.15s ease;
      }
      .pill.hidden {
        opacity: 0;
        transform: translateY(10px) scale(0.96);
        pointer-events: none;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px) scale(0.96); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      .waveform {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2px;
        height: 18px;
      }
      .wave-bar {
        width: 2px;
        background: linear-gradient(to top, #4a5bc7, #7b8aed);
        border-radius: 1px;
        transition: none; /* Crucial: remove CSS transition to prevent conflicts with JS requestAnimationFrame! */
      }

      .spinner {
        width: 14px;
        height: 14px;
        border: 2px solid rgba(94, 106, 210, 0.25);
        border-top-color: #7b8aed;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="pill" id="pill">
      <div class="waveform" id="waveform">
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
      </div>
      <div class="spinner" id="spinner" style="display: none;"></div>
    </div>
    <script type="module">
      import { invoke } from "@tauri-apps/api/core";

      const pill = document.getElementById("pill");
      const waveform = document.getElementById("waveform");
      const spinner = document.getElementById("spinner");
      const bars = waveform.querySelectorAll(".wave-bar");

      const NUM_BARS = bars.length;
      let currentLevels = new Array(NUM_BARS).fill(0);
      let targetLevels = new Array(NUM_BARS).fill(0);
      let isRunning = false;
      let animationId = null;
      let pollInterval = null;

      let currentPitchFactor = 0.3;  // Smoothed pitch (0 = deep, 1 = high)
      let pitchFactorTarget = 0.3;   // Latest pitch from the poll

      let ripplePhase = 0;           // Continuous traveling-wave phase, advanced per frame
      let lastFrameTime = 0;         // requestAnimationFrame timestamp of the previous frame

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      // Render loop: each bar eases toward its center-weighted target, and a continuous
      // traveling ripple modulates the heights (the double-mountain motion).
      function renderLoop(now) {
        if (!isRunning) return;

        if (!lastFrameTime) lastFrameTime = now;
        const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
        lastFrameTime = now;

        const maxH = 16;
        const minH = 2;

        currentPitchFactor = lerp(currentPitchFactor, pitchFactorTarget, 0.08);

        const riseRate = 0.14 + currentPitchFactor * 0.12;
        const decayRate = 0.08 + currentPitchFactor * 0.12;

        const rippleSpeed = 0.3 + currentPitchFactor * 2.2;
        const rippleFrequency = 0.35 + currentPitchFactor * 0.75;
        ripplePhase += rippleSpeed * dt * 5.0;

        for (let i = 0; i < NUM_BARS; i++) {
          const t = targetLevels[i];
          const c = currentLevels[i];
          const lerpFactor = t > c ? riseRate : decayRate;
          currentLevels[i] = lerp(c, t, lerpFactor);

          const norm = (Math.sin(i * rippleFrequency - ripplePhase) + 1) / 2;
          const h = minH + (maxH - minH) * currentLevels[i] * (0.6 + 0.4 * norm);
          bars[i].style.height = `${h}px`;
        }

        animationId = requestAnimationFrame(renderLoop);
      }

      async function pollFrequency() {
        try {
          const bands = await invoke("get_frequency_bands");

          // Overall loudness (peak band), lightly amplified.
          let amplitude = 0;
          for (let i = 0; i < 16; i++) {
            if (bands[i] > amplitude) amplitude = bands[i];
          }
          amplitude = Math.min(1.0, amplitude * 1.4);

          // Spectral centroid -> pitch factor over the realistic voice range (bands ~2..7),
          // so higher pitch clearly lifts the waveform.
          let sum = 0, weighted = 0;
          for (let j = 0; j < 16; j++) {
            const a = bands[j] || 0;
            sum += a;
            weighted += a * j;
          }
          if (sum > 0.03) {
            const centroid = weighted / sum;
            const norm = Math.max(0, Math.min(1, (centroid - 2.0) / 5.0));
            pitchFactorTarget = 0.05 + 0.95 * norm;
          } else {
            pitchFactorTarget = 0.25;
          }

          // Center-weighted bell per bar, reacting to global loudness plus a touch of the
          // local band. Higher pitch lifts the whole waveform.
          const heightMultiplier = 0.65 + currentPitchFactor * 1.25;
          const levels = new Array(NUM_BARS).fill(0);
          for (let i = 0; i < NUM_BARS; i++) {
            const bell = Math.sin((i / (NUM_BARS - 1)) * Math.PI);
            const shape = 0.18 + 0.82 * Math.pow(bell, 2.2);

            const distanceFromCenter = Math.abs(i - (NUM_BARS - 1) / 2) / ((NUM_BARS - 1) / 2);
            const freqIndex = 2 + Math.round(distanceFromCenter * 11);
            const localPitch = (bands[freqIndex] || 0) * 1.6;

            const activeVal = (amplitude * 0.8) + (localPitch * 0.2);
            levels[i] = Math.min(1.0, activeVal * shape * heightMultiplier);
          }
          targetLevels = levels;
        } catch (e) {
          console.error("freq error:", e);
        }
      }

      window.__setPillState = function(state) {
        isRunning = false;
        if (animationId) {
          cancelAnimationFrame(animationId);
          animationId = null;
        }
        if (pollInterval) {
          clearInterval(pollInterval);
          pollInterval = null;
        }

        pill.className = "pill";

        if (state === "recording") {
          pill.classList.add("recording");
          waveform.style.display = "flex";
          spinner.style.display = "none";
          
          currentLevels = new Array(NUM_BARS).fill(0);
          targetLevels = new Array(NUM_BARS).fill(0);
          currentPitchFactor = 0.3;
          pitchFactorTarget = 0.3;
          ripplePhase = 0;
          lastFrameTime = 0;

          isRunning = true;
          animationId = requestAnimationFrame(renderLoop);
          pollFrequency();
          pollInterval = setInterval(pollFrequency, 25); // Poll at 40fps (~25ms)
        } else if (state === "processing") {
          pill.classList.add("processing");
          waveform.style.display = "none";
          spinner.style.display = "block";
        } else {
          pill.classList.add("hidden");
          waveform.style.display = "flex";
          spinner.style.display = "none";
          currentLevels = new Array(NUM_BARS).fill(0);
          bars.forEach(bar => bar.style.height = "2px");
        }
      };
    </script>
  </body>
</html>
