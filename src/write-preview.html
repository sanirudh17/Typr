<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Typr — Rewrite preview</title>
  <script>document.documentElement.dataset.theme = window.__WRITE_PREVIEW__?.light ? "light" : "dark";</script>
  <style>
    :root { color-scheme:dark; --bg:#09090b; --surface:#131316; --text:#ececef; --muted:#a1a1aa; --border:#35353e; --accent:#5e6ad2; font-family:'IBM Plex Sans','Segoe UI',sans-serif; }
    :root[data-theme="light"] { color-scheme:light; --bg:#eef0f3; --surface:#fff; --text:#18181b; --muted:#52525b; --border:#c5c7d0; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); padding:24px; height:100vh; display:flex; flex-direction:column; gap:16px; font-size:14px; }
    header { display:flex; align-items:center; justify-content:space-between; cursor:default; }
    h1 { font-size:18px; margin:0; font-weight:600; }
    p { margin:0; color:var(--muted); line-height:1.5; }
    textarea { flex:1; min-height:80px; width:100%; resize:none; padding:14px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font:inherit; line-height:1.6; }
    button { border:1px solid var(--border); border-radius:6px; padding:9px 16px; background:var(--surface); color:var(--text); font:inherit; cursor:pointer; }
    button:hover { filter:brightness(1.12); }
    button:disabled { opacity:.55; cursor:default; }
    button:focus-visible,textarea:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
    ::selection { background:var(--accent); color:#fff; }
    textarea { caret-color:var(--accent); scrollbar-color:var(--border) var(--surface); }
    #close { border:0; background:transparent; padding:6px; display:flex; }
    footer { display:flex; align-items:center; justify-content:space-between; gap:16px; }
    #copy { background:var(--accent); color:#fff; border-color:transparent; font-weight:600; flex-shrink:0; }
    #status { font-size:13px; }
    @media (max-width:440px) { body { padding:16px; } footer { flex-wrap:wrap; } }
  </style>
</head>
<body>
  <header id="drag"><h1>Rewrite preview</h1><button id="close" type="button" aria-label="Close preview"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5"/></svg></button></header>
  <p>Terminal highlights cannot be replaced directly. Copy this rewrite into your prompt when it is ready.</p>
  <textarea id="text" aria-label="Rewritten text" maxlength="16000" spellcheck="false"></textarea>
  <footer><p id="status" role="status" aria-live="polite">Your terminal text has been kept.</p><button id="copy" type="button">Copy rewrite</button></footer>
  <script>
    const invoke = window.__TAURI__.core.invoke;
    const win = window.__TAURI__.window.getCurrentWindow();
    const text = document.getElementById("text");
    text.value = window.__WRITE_PREVIEW__?.text || "";
    delete window.__WRITE_PREVIEW__;
    document.getElementById("drag").addEventListener("mousedown", (event) => { if (!event.target.closest("button")) void win.startDragging(); });
    document.getElementById("close").onclick = () => win.close();
    document.addEventListener("keydown", (event) => { if (event.key === "Escape") { event.preventDefault(); void win.close(); } });
    document.getElementById("copy").onclick = async () => {
      const button = document.getElementById("copy"); button.disabled = true;
      try { await invoke("copy_write_preview", { text:text.value }); document.getElementById("status").textContent = "Copied. Paste it into your terminal prompt."; }
      catch (error) { document.getElementById("status").textContent = String(error); }
      finally { button.disabled = false; }
    };
    requestAnimationFrame(() => requestAnimationFrame(() => invoke("show_write_preview")));
  </script>
</body>
</html>
